<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Space Grotesk', Helvetica, Arial, sans-serif">
  <defs>
    <style>@font-face{font-family:Calera;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
    <radialGradient id="glow" cx="72%" cy="50%" r="55%">
      <stop offset="0" stop-color="#fd6e00" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fd6e00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="#131316"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <line x1="400" y1="180" x2="400" y2="420" stroke="#ffffff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- left: ordinary folded seam, the ridge faces and rubs the skin -->
  <g opacity=".75">
    <path d="M40 260H170q30 0 30 30v40" fill="none" stroke="#6b6b75" stroke-width="16" stroke-linecap="round"/>
    <path d="M360 260H230q-30 0 -30 30v40" fill="none" stroke="#8a8a94" stroke-width="16" stroke-linecap="round"/>
    <rect x="180" y="290" width="40" height="66" rx="10" fill="#4a4a52"/>
    <path d="M176 305h48M176 323h48M176 341h48" stroke="#b0b0ba" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 371H360" stroke="#3a2216" stroke-width="22"/>
    <path d="M160 340l-14-10M240 340l14-10M150 362l-18 0M250 362l18 0" fill="none" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- right: flat seam, edges butted and locked with cover stitches -->
  <path d="M440 260H596" stroke="#fd6e00" stroke-width="16" stroke-linecap="round"/>
  <path d="M604 260H760" stroke="#ffb066" stroke-width="16" stroke-linecap="round"/>
  <path d="M560 260l10 -16l10 32l10 -32l10 32l10 -32l10 32l10 -32l10 16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M440 371H760" stroke="#3a2216" stroke-width="22"/>
  <path d="M470 210h-24l12-8M470 210h-24l12 8M730 210h24l-12-8M730 210h24l-12 8" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="200" y="100" font-size="28" font-family="Calera" font-weight="400" opacity=".55">REGULAR SEAM</text>
    <text x="200" y="130" font-size="20" fill="#ff6b6b" opacity=".8">BULKY · SCRATCHY</text>
    <text x="600" y="100" font-size="28" font-family="Calera" font-weight="400" fill="#fd6e00">OUR FLAT SEAM</text>
    <text x="600" y="130" font-size="20" opacity=".8">LOW-PROFILE · CHAFE-FREE</text>
    <text x="600" y="216" font-size="17" opacity=".6">STRETCHES ALL WAYS</text>
  </g>
  <text x="760" y="410" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="2" opacity=".4" text-anchor="end">SKIN</text>
</svg>
