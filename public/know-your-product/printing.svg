<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Space Grotesk', Helvetica, Arial, sans-serif">
  <defs>
    <style>@font-face{font-family:Calera;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fd6e00" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fd6e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dye" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fd6e00"/>
      <stop offset=".5" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <g id="fibre-grey"><circle r="22" fill="#2c2c33" stroke="#55555f" stroke-width="3"/></g>
    <g id="fibre-dyed"><circle r="22" fill="url(#dye)"/><circle r="22" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/></g>
  </defs>
  <rect width="800" height="600" fill="#131316"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(0,-30)">
  <line x1="400" y1="200" x2="400" y2="440" stroke="#ffffff" stroke-opacity=".12" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- left: ink film sitting on top of the fibres, cracking -->
  <g opacity=".75">
    <use href="#fibre-grey" x="90" y="340"/><use href="#fibre-grey" x="140" y="340"/>
    <use href="#fibre-grey" x="190" y="340"/><use href="#fibre-grey" x="240" y="340"/>
    <use href="#fibre-grey" x="290" y="340"/><use href="#fibre-grey" x="340" y="340"/>
    <use href="#fibre-grey" x="115" y="385"/><use href="#fibre-grey" x="165" y="385"/>
    <use href="#fibre-grey" x="215" y="385"/><use href="#fibre-grey" x="265" y="385"/>
    <use href="#fibre-grey" x="315" y="385"/>
    <g fill="#d94f2b">
      <path d="M66 300h70l-6 18H66z"/>
      <path d="M144 300h82l-4 10l-6 8H138z"/>
      <path d="M234 300h60l6 18H228z"/>
      <path d="M302 300h62v18H308z"/>
    </g>
    <g fill="#d94f2b" opacity=".9">
      <path d="M150 268l14 6l-4 12l-14-4z"/>
      <path d="M296 258l12 4l-2 12l-12-2z"/>
    </g>
  </g>

  <!-- right: dye turned to gas, now inside every fibre -->
  <g fill="#ff8a3d" opacity=".55">
    <circle cx="470" cy="250" r="5"/><circle cx="520" cy="270" r="4"/><circle cx="560" cy="245" r="6"/>
    <circle cx="610" cy="275" r="4"/><circle cx="650" cy="250" r="5"/><circle cx="700" cy="268" r="4"/>
    <circle cx="740" cy="245" r="5"/>
  </g>
  <use href="#fibre-dyed" x="460" y="340"/><use href="#fibre-dyed" x="510" y="340"/>
  <use href="#fibre-dyed" x="560" y="340"/><use href="#fibre-dyed" x="610" y="340"/>
  <use href="#fibre-dyed" x="660" y="340"/><use href="#fibre-dyed" x="710" y="340"/>
  <use href="#fibre-dyed" x="485" y="385"/><use href="#fibre-dyed" x="535" y="385"/>
  <use href="#fibre-dyed" x="585" y="385"/><use href="#fibre-dyed" x="635" y="385"/>
  <use href="#fibre-dyed" x="685" y="385"/>

  </g>

  <g fill="#ffffff" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="215" y="100" font-size="28" font-family="Calera" font-weight="400" opacity=".55">SURFACE PRINT</text>
    <text x="215" y="130" font-size="20" fill="#ff6b6b" opacity=".8">SITS ON TOP · CRACKS</text>
    <text x="600" y="100" font-size="28" font-family="Calera" font-weight="400" fill="#fd6e00">SUBLIMATION</text>
    <text x="600" y="130" font-size="20" opacity=".8">INK BECOMES THE FIBRE</text>
    <text x="600" y="420" font-size="20" opacity=".6">INK → GAS → FIBRE</text>
  </g>
</svg>
