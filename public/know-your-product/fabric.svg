<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Space Grotesk', Helvetica, Arial, sans-serif">
  <defs>
    <style>@font-face{font-family:Calera;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Space Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
    <radialGradient id="glow" cx="60%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fd6e00" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fd6e00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2216"/>
      <stop offset="1" stop-color="#1c110b"/>
    </linearGradient>
    <g id="drop"><path d="M0-14C6-5 9 0 9 5a9 9 0 0 1-18 0c0-5 3-10 9-19z" fill="#6cc4ff"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6cc4ff"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#131316"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- vapour leaving the outer face -->
  <g fill="none" stroke="#e8e8ee" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M300 230c-14-18 14-30 0-48s14-30 0-48"/>
    <path d="M420 230c-14-18 14-30 0-48s14-30 0-48"/>
    <path d="M540 230c-14-18 14-30 0-48s14-30 0-48"/>
    <path d="M660 230c-14-18 14-30 0-48s14-30 0-48"/>
  </g>

  <!-- knit: two staggered rows of yarn cross-sections -->
  <g fill="#26262d" stroke="#fd6e00" stroke-width="3">
    <ellipse cx="200" cy="300" rx="34" ry="22"/><ellipse cx="290" cy="300" rx="34" ry="22"/>
    <ellipse cx="380" cy="300" rx="34" ry="22"/><ellipse cx="470" cy="300" rx="34" ry="22"/>
    <ellipse cx="560" cy="300" rx="34" ry="22"/><ellipse cx="650" cy="300" rx="34" ry="22"/>
    <ellipse cx="740" cy="300" rx="34" ry="22"/>
    <ellipse cx="155" cy="350" rx="34" ry="22"/><ellipse cx="245" cy="350" rx="34" ry="22"/>
    <ellipse cx="335" cy="350" rx="34" ry="22"/><ellipse cx="425" cy="350" rx="34" ry="22"/>
    <ellipse cx="515" cy="350" rx="34" ry="22"/><ellipse cx="605" cy="350" rx="34" ry="22"/>
    <ellipse cx="695" cy="350" rx="34" ry="22"/><ellipse cx="785" cy="350" rx="34" ry="22"/>
  </g>

  <!-- sweat pulled up through the knit -->
  <g stroke="#6cc4ff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" fill="none" marker-end="url(#arr)">
    <path d="M290 455V255"/><path d="M425 455V255"/><path d="M560 455V255"/><path d="M695 455V255"/>
  </g>

  <!-- skin with sweat -->
  <rect y="480" width="800" height="120" fill="url(#skin)"/>
  <g>
    <use href="#drop" x="290" y="468"/><use href="#drop" x="425" y="468"/>
    <use href="#drop" x="560" y="468"/><use href="#drop" x="695" y="468"/>
  </g>

  <g fill="#ffffff" font-weight="700" letter-spacing="2">
    <text x="40" y="70" font-size="36" font-family="Calera" font-weight="400" fill="#fd6e00">QUICK-DRI</text>
    <text x="40" y="112" font-size="28" opacity=".8">SWEAT OUT. AIR IN.</text>
    <text x="760" y="70" font-size="22" text-anchor="end" opacity=".7">EVAPORATES FAST</text>
    <text x="760" y="420" font-size="22" text-anchor="end" fill="#6cc4ff">WICKED AWAY</text>
    <text x="760" y="560" font-size="22" text-anchor="end" opacity=".5">SKIN</text>
  </g>
</svg>
